baseURL = 'https://tribectf.cs.wm.edu'
# HTML slide decks live in slides/ and are served from the site root (slides/closing -> /closing/)
staticDir = ['static', 'slides']
languageCode = 'en-us'
title = 'TribeCTF 2026'
theme = "nightfall"

[menu]
  [[menu.header]]
    name = "about"
    weight = 1
    url = "about"
  [[menu.header]]
    name = "challenges"
    weight = 2
    url = "challenges"
  [[menu.header]]
    name = "rules"
    weight = 3
    url = "rules"
  # Past events. The header template renders only one level of children, so these
  # stay flat rather than nesting a dropdown per year.
  [[menu.header]]
    name = "past"
    weight = 4
    identifier = "past"
  [[menu.header]]
    name = "↳ 2025 recap"
    parent = "past"
    weight = 1
    url = "2025-recap"
  [[menu.header]]
    name = "↳ 2024 recap"
    parent = "past"
    weight = 2
    url = "2024-recap"
  [[menu.header]]
    name = "↳ 2024 writeups"
    parent = "past"
    weight = 3
    url = "writeups/2024"

[params]
readingTime = false  # Show reading time on post page
published = false  # Show published data on post page
user = "TribeCTF "
hostname = " WM"
# CAGE queue backend (tribectf-cage repo) for /enter-the-cage/. The 2026 VM is torn down and
# the queue page is closed; for next year set it to the new VM's HTTPS URL (no trailing
# slash, see the tribectf-cage RUNBOOK) and restore {{< cage-queue >}} in content/enter-the-cage.md.
cageApi = ""
  [params.author]
    name = "TribeCTF 2026"
  [params.site]
    name = "TribeCTF 2026"  # Website and RSS feed author
    tagline = "Code, Crack, Conquer... Again!"
    detail = "William & Mary's annual cybersecurity challenge where code breakers meet ethical hackers, and only the nerdiest will capture all flags."
  [params.styles]
    color = "#7ee787"  # terminal green — matches homepage console accents



[[params.social]]
key = 0
name = "Join the conversation on Discord"
url = "https://discord.gg"
target = "_blank"
aria = "Discord Server"

[markup.goldmark.renderer]
unsafe = true

# NOTE: /2024 -> /2024-recap and /2025 -> /2025-recap redirects live as `aliases`
# in each recap page's front matter. Hugo's [[redirects]] block is Netlify-only
# and emits nothing on our GitHub Pages deploy.